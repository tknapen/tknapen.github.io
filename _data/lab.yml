# Arrow of Time dataset (home-page callout and Software & data page)
aot:
  name: Arrow of Time (AOT)
  summary: >-
    An intensive 7T fMRI dataset of brain responses to 2,160 brief naturalistic
    videos, with about 21 hours of scanning per participant at 1.7 mm isotropic
    resolution, plus retinotopy and motion-energy localizers for every participant.
  # The home-page callout shows `short` with the numbers below set large (same facts as `summary`).
  # Each label is read before its number by screen readers, so it must make sense on its own.
  short: >-
    An intensive 7T fMRI dataset of brain responses to brief naturalistic videos,
    with retinotopy and motion-energy localizers for every participant.
  stats:
    - value: "2,160"
      label: Naturalistic videos
    - value: "≈21 h"
      label: 7T scanning per participant
    - value: "1.7 mm"
      label: Isotropic resolution
  release: The first release is planned around the turn of the year (2026/27).
  signup: https://forms.gle/BMmfyWEZKL7vU5Va9
  post: /2026/04/24/AOT.html

# prfmodel, developed in the Popylar project (home-page callout and Software & data page)
popylar:
  heading: "prfmodel: population receptive field modeling in Python"
  summary: >-
    prfmodel fits population receptive field (pRF) models and related models, such as
    connective field and contrast sensitivity models, on GPU-accelerated backends
    (TensorFlow, PyTorch or JAX). It is developed by the Popylar team with research
    software engineers of the Netherlands eScience Center.
  install: pip install "prfmodel[tensorflow]"
  note: >-
    Version 0.2.0 (beta) was released for our hands-on workshop in Coimbra,
    5–6 November 2026. The practicals and the slides of several lectures are public.
  docs: https://popylar-org.github.io/prfmodel/
  code: https://github.com/popylar-org/prfmodel
  workshop: https://popylar-org.github.io/2026-11-05_workshop-coimbra/
  post: /2026/11/06/popylar-workshop-coimbra.html
