# Animations shown on the site (rendered by _includes/clip.html; all of them are listed on /animations/).
# Each clip is a silent MP4 in assets/clips/<id>.mp4 with a still in assets/clips/<id>.webp, both made by
# tools/add_clip.sh, or by tools/render.py in github.com/tknapen/site-animations for clips made for the site.
# A dark-background render of the same clip goes in assets/clips/dark/ under the same name
# (tools/add_clip.sh ... --dark) and is then shown automatically to visitors in dark mode; nothing changes here.
# Fields: id, title (short, also the accessible name), caption (what the animation shows, in full sentences:
# it is the text alternative), width and height in pixels, seconds, page and page_title (where the clip is
# used in context, for the link on /animations/), home (true: the clip shown on the home page, one only).

- id: stimulus-to-bold
  title: From stimulus to predicted BOLD signal
  caption: >-
    A bar sweeps across the visual field in eight directions. Each time it crosses the receptive field
    (small circle), the model predicts a neural response. The slower hemodynamic response turns that into
    the predicted BOLD signal. Simulated with prfmodel.
  width: 1280
  height: 640
  seconds: 12
  page: /research/computational-models/
  page_title: Computational models

- id: model-as-chain
  title: The model as a chain of stages
  caption: >-
    The model takes parameters θ and a stimulus and returns a predicted time series. Inside, it is a chain
    of stages: stimulus features, spatial pooling, a transformation, neural dynamics and the hemodynamic
    response function (HRF). Four stages carry fitted parameters. The time series shown are synthetic.
  width: 1280
  height: 640
  seconds: 16
  page: /research/computational-models/
  page_title: Computational models

- id: grid-and-fit
  title: Fitting a population receptive field
  caption: >-
    Fitting one measured voxel. A grid search tries receptive field positions and sizes and keeps the best
    one (dashed circle); refinement then adjusts it until the prediction follows the measured time series.
    The variance explained, R², is 0.84 at the best grid point and 0.86 after refinement.
  width: 1280
  height: 640
  seconds: 20
  page: /research/computational-models/
  page_title: Computational models

- id: dn-bar-sweep
  title: A bar crosses a divisive normalization pRF
  caption: >-
    Simulation of the divisive normalization pRF model. Left, the visual field with the pRF: the solid
    circle marks the activation pool (σ₁), the dashed circle the larger normalization pool (σ₂). As a bar
    crosses the field, the activation pool (numerator) responds only near the pRF and the normalization
    pool (denominator) over a wider range. Their ratio, the response, peaks at the pRF and dips below
    zero on both sides. Simulated with prfmodel; parameter values are illustrative.
  width: 1280
  height: 640
  seconds: 12
  page: /research/computational-models/
  page_title: Computational models

- id: dn-size-tuning
  title: Size tuning and oversaturation
  caption: >-
    Simulation of the divisive normalization pRF model. A disc grows around the pRF center. The response
    rises while the disc fills the activation pool (solid circle), then falls as the disc keeps filling
    the larger normalization pool (dashed circle). A larger normalization constant d gives a weaker
    response that falls less, and when the two pools have the same size the response levels off without
    falling. Simulated with prfmodel; parameter values are illustrative.
  width: 1280
  height: 640
  seconds: 24
  page: /research/computational-models/
  page_title: Computational models

- id: fields-to-map
  title: From fitted receptive fields to a map
  caption: >-
    Each dot is the fitted receptive field center of one voxel, and each square is that voxel on a schematic
    sheet of cortex. Colored by distance from fixation, and then by direction from fixation, neighboring
    voxels prefer neighboring positions: a map of the visual field. The voxels are simulated, and each is
    fitted on its own.
  width: 1280
  height: 640
  seconds: 18
  page: /research/topographic-maps/
  page_title: Topographic maps
  home: true
