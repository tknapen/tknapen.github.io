# Knapen Lab website
#
# Built by GitHub Pages (Jekyll 3.10, see Gemfile). Local preview:
#   bundle install && bundle exec jekyll serve
# How to add papers, people and news: see README.md.

title: Knapen Lab
tagline: Computational cognitive neuroscience
description: >-
  Knapen Lab, Vrije Universiteit Amsterdam and Spinoza Centre for Neuroimaging:
  how the brain's topographic maps organize perception, action and social cognition.
url: https://tknapen.github.io
baseurl: ""
repository: tknapen/tknapen.github.io
lang: en

# Used by jekyll-seo-tag for titles, descriptions and link-preview cards
logo: /assets/img/social-card.png
twitter:
  username: tknapen
  card: summary_large_image
author:
  name: Tomas Knapen
  twitter: tknapen
social:
  name: Knapen Lab
  links:
    - https://x.com/tknapen
    - https://github.com/tknapen
    - https://bsky.app/profile/tknapen.bsky.social
    - https://www.linkedin.com/in/tomas-knapen-92425319

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml
  posts_limit: 20

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  research:
    output: true
    permalink: /research/:path/
  publications:
    output: true
    permalink: /publications/:path/
  people:
    output: true
    permalink: /people/:path/
  resources:
    output: true
    permalink: /resources/:path/

defaults:
  # Link-preview image for every page (jekyll-seo-tag reads page.image only)
  - scope: { path: "" }
    values: { image: /assets/img/social-card.png }
  - scope: { path: "google8d229e177b46e04e.html" }
    values: { sitemap: false }
  - scope: { path: "img" }
    values: { sitemap: false }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: publications }
    values: { layout: publication, author: { name: Knapen Lab, twitter: tknapen } }
  - scope: { path: "", type: people }
    values: { layout: person }
  - scope: { path: "", type: research }
    values: { layout: theme }
  - scope: { path: "", type: resources }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
  - .github
  - "*.psd"

future: true

# No GitHub Pages default theme (it would add unused CSS and fallback layouts)
theme: null
