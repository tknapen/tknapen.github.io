# Knapen Lab website
#
# Built by GitHub Pages (Jekyll 3.10, see Gemfile). Local preview:
#   bundle install && bundle exec jekyll serve
# How to add papers, people and news: see README.md.

title: Knapen Lab
tagline: Computational cognitive neuroscience
description: >-
  The Knapen Lab studies how the brain's topographic maps organize perception,
  action and social cognition, using intensive high-resolution neuroimaging and
  computational models. Vrije Universiteit Amsterdam and Spinoza Centre for
  Neuroimaging.
url: https://tknapen.github.io
baseurl: ""
repository: tknapen/tknapen.github.io
lang: en

# Used by jekyll-seo-tag for titles, descriptions and link-preview cards
logo: /assets/img/social-card.png
image: /assets/img/social-card.png
twitter:
  username: tknapen
  card: summary_large_image
author:
  name: Tomas Knapen
social:
  name: Knapen Lab
  links:
    - https://x.com/tknapen
    - https://github.com/tknapen

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml
  posts_limit: 20

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  research:
    output: true
    permalink: /research/:path/
  publications:
    output: true
    permalink: /publications/:path/
  people:
    output: true
    permalink: /people/:path/
  resources:
    output: true
    permalink: /resources/:path/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: publications }
    values: { layout: publication }
  - scope: { path: "", type: people }
    values: { layout: person }
  - scope: { path: "", type: research }
    values: { layout: theme }
  - scope: { path: "", type: resources }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
  - .github
  - "*.psd"

future: true
