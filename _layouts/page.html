---
layout: default
---
<article class="wrap wrap-text page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.description and page.hide_description != true %}
    <p class="page-lead">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
